[project]
name = "claude-radical-red"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cached-property>=2.0.1",
    "cffi>=2.0.0",
    "fastmcp>=3.4.5",
    "imageio>=2.34.0",
    "imageio-ffmpeg>=0.5.0",
    "mgba",
    "PyYAML>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rrbench*"]
namespaces = true

[tool.uv.sources]
mgba = { path = "vendor/mgba" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
